name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Rodar lint
        run: npm run lint
      
      - name: Rodar testes
        run: npm run test
      
      - name: Buildar o projeto
        run: npm run build
