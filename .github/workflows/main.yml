name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Instalar dependências
        run: cd viagenslist && npm ci

      - name: Rodar lint
        run: cd viagenslist && npm run lint

      - name: Rodar testes
        run: cd viagenslist && npm run test

      - name: Buildar o projeto
        run: cd viagenslist && npm run build

      - name: Deploy para Vercel
        run: cd viagenslist && npx vercel --token ${{ secrets.VERCEL_TOKEN }} --yes
      
      
      
